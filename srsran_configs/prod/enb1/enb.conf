[enb]
enb_id = 0x19B  # 20-битный идентификатор eNB
mcc = 250  # Мобильный код страны
mnc = 63  # Мобильный код сети
mme_addr = 172.18.0.2  # IP-адрес MME для S1-соединения
gtp_bind_addr = 172.18.0.3  # Локальный IP-адрес для привязки GTP
s1c_bind_addr = 172.18.0.3  # Локальный IP-адрес для привязки S1AP
s1c_bind_port = 0  # Исходный порт для S1AP (0 = любой)
n_prb = 6  # Количество физических ресурсных блоков (6,15,25,50,75,100)

[enb_files]
sib_config = sib.conf  # Файл конфигурации SIB1, SIB2, SIB3
rr_config  = rr.conf  # Файл конфигурации радиоресурсов
rb_config = rb.conf  # Файл конфигурации SRB/DRB

[rf]
tx_gain = 90  # Коэффициент передачи (дБ)
rx_gain = 70  # Коэффициент приёма (дБ)

[log]
all_level = info     # Базовый уровень для всех слоёв
all_hex_limit = 64   # Лимит hex-дампа (байт)
# Детальные уровни для диагностики attach телефона
# NAS-сообщения в srsenb логируются через rrc_level (отдельной опции log.nas_level нет)
rrc_level = debug    # RRC + встроенный NAS: соединение UE, attach, реконфигурация
s1ap_level = debug   # S1AP: S1-MME с ядром
mac_level = info     # MAC: планирование, RACH
phy_level = info     # PHY: синхронизация, принятый сигнал
filename = /var/log/srsran/enb.log  # Путь к файлу лога
file_max_size = 20000  # Макс. размер файла (КБ) ~20 МБ, ротация при превышении

[gui]
enable = false  # Включить GUI

[expert]
rrc_inactivity_timer = 70000  # Таймаут неактивности RRC (мс)


