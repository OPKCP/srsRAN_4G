[enb]
enb_id = 0x19C  # 20-битный идентификатор eNB
mcc = 250  # Мобильный код страны
mnc = 63  # Мобильный код сети
mme_addr = 172.18.0.2  # IP-адрес MME для S1-соединения
gtp_bind_addr = 172.18.0.4  # Локальный IP-адрес для привязки GTP
s1c_bind_addr = 172.18.0.4  # Локальный IP-адрес для привязки S1AP
s1c_bind_port = 0  # Исходный порт для S1AP (0 = любой)
n_prb = 6  # Количество физических ресурсных блоков (6,15,25,50,75,100)

[enb_files]
sib_config = sib.conf  # Файл конфигурации SIB1, SIB2, SIB3
rr_config  = rr.conf  # Файл конфигурации радиоресурсов
rb_config = rb.conf  # Файл конфигурации SRB/DRB

[rf]
tx_gain = 70  # Коэффициент передачи (дБ)
rx_gain = 60  # Коэффициент приёма (дБ)

[log]
all_level = warning  # Уровень логирования для всех слоёв
all_hex_limit = 32  # Лимит hex-дампа для всех слоёв
filename = /var/log/srsran/enb.log  # Путь к файлу лога
file_max_size = -1  # Макс. размер файла (КБ); -1 = один файл

[gui]
enable = false  # Включить GUI

[expert]
rrc_inactivity_timer = 70000  # Таймаут неактивности RRC (мс)

[radar]
enable               = true     # Включить радарную подсистему
nof_enodebs          = 4        # Количество eNodeB в радарной сети
local_enodeb_id      = 1        # Локальный ID данного инстанса eNodeB
signal_type          = 2        # Тип сигнала: 0=M-seq, 1=Barker-11, 2=Barker-13
signal_len           = 1023     # Длина M-последовательности (при signal_type=0)
lfsr_seed            = 74565    # Seed LFSR для M-seq (ненулевое значение)
power_db             = 0.0      # Мощность радарного сигнала (дБ)
session_duration_sf  = 5        # Длительность радарного сеанса (субфреймы)
periodic_enable      = true     # Включить периодический запуск радарных сеансов
periodic_period_ms   = 100      # Период между сеансами (мс)
tx_enodeb_id         = 0        # ID передающей eNodeB
cfar_threshold_db    = 6.0      # Порог детекции CFAR (дБ над уровнем шума)
log_detections       = true     # Логировать детекции целей в PHY-лог
debug.tx_console_out = false    # Отладочный консольный вывод TX-части радара
debug.rx_console_out = false    # Отладочный консольный вывод RX-части радара
