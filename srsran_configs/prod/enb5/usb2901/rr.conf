#####################################################################
# rr.conf — радиоконфигурация eNB2 (USRP-2901, pi5-2)
#
# Собственная ячейка: EARFCN 1260 = 1811.0 МГц, pci = 5, cell_id = 0x01.
# Соседняя ячейка (первая БС eNB1): EARFCN 1300 = 1815.0 МГц, pci = 1.
# Настроен измерительный отчёт события A3 для меж-частотного хендовера.
#####################################################################
mac_cnfg =
{
  phr_cnfg =
  {
    dl_pathloss_change = "dB3";
    periodic_phr_timer = 50;
    prohibit_phr_timer = 0;
  };
  ulsch_cnfg =
  {
    max_harq_tx = 4;
    periodic_bsr_timer = 20;
    retx_bsr_timer = 320;
  };

  time_alignment_timer = -1;  // -1 = бесконечно
};

phy_cnfg =
{
  phich_cnfg =
  {
    duration  = "Normal";
    resources = "1/6";
  };

  pusch_cnfg_ded =
  {
    beta_offset_ack_idx = 6;
    beta_offset_ri_idx  = 6;
    beta_offset_cqi_idx = 6;
  };

  sched_request_cnfg =
  {
    dsr_trans_max = 64;
    period = 20;
    nof_prb = 1;
  };
  cqi_report_cnfg =
  {
    mode = "periodic";
    simultaneousAckCQI = true;
    period = 40;
    m_ri = 8;
  };
};

cell_list =
(
  {
    cell_id = 0x01;
    tac = 0x0007;
    pci = 5;
    dl_earfcn = 1260;  // 1811 МГц (Band 3)
    ho_active = true;

    scell_list = (
    )

    meas_cell_list =
    (
      // Соседняя ячейка = первая БС (eNB1, pi5-2 USRP-2901 сосед):
      // 192.168.1.15, EARFCN 1300 (1815 МГц), pci 1, eci 0x19B01
      {
        eci = 0x19B01;
        dl_earfcn = 1300;
        pci = 1;
        direct_forward_path_available = false;
        allowed_meas_bw = 6;
        cell_individual_offset = 0;
      }
    );

    meas_report_desc =
    (
        {
          eventA = 3
          a3_offset = 3;
          hysteresis = 0;
          time_to_trigger = 480;
          trigger_quant = "RSRP";
          max_report_cells = 2;
          report_interv = 240;
          report_amount = 1;
        }
    );
    meas_quant_desc = {
        rsrq_config = 4;
        rsrp_config = 4;
     };
  }
);

nr_cell_list =
(
);
