#####################################################################
# enb.conf — Вторая базовая станция (eNB2) на USRP-2901 (pi5-2)
#
# Ядро (EPC) находится на ТОМ ЖЕ хосте pi5-2 (192.168.1.16).
# Чтобы не конфликтовать с EPC (слушает 192.168.1.16:2152 GTP-U),
# eNB2 использует собственный вторичный IP 192.168.1.20 на eth0:
#   - s1c_bind_addr / gtp_bind_addr = 192.168.1.20
#   - mme_addr = 192.168.1.16 (SCTP 36412)
#
# Несущая: EARFCN 1260 = 1811.0 МГц (Band 3).
# Расчёт: первая БС 1815 МГц − (полоса 3 МГц + защитный интервал 1 МГц) = 1811 МГц.
#####################################################################
[enb]
enb_id = 0x19F  # 20-битный идентификатор eNB (второй, pi5-2)
mcc = 250  # Мобильный код страны
mnc = 63  # Мобильный код сети
mme_addr = 192.168.1.16  # IP-адрес MME (EPC-контейнер, тот же хост pi5-2)
gtp_bind_addr = 192.168.1.20  # Локальный IP eNB2 (вторичный адрес pi5-2)
s1c_bind_addr = 192.168.1.20  # Локальный IP eNB2 для привязки S1AP
s1c_bind_port = 0  # Исходный порт для S1AP (0 = любой)
n_prb = 15  # Количество физических ресурсных блоков (6,15,25,50,75,100) → 3 МГц

[enb_files]
sib_config = sib.conf  # Файл конфигурации SIB1, SIB2, SIB3
rr_config  = rr.conf  # Файл конфигурации радиоресурсов
rb_config = rb.conf  # Файл конфигурации SRB/DRB

[rf]
# USRP-2901 (serial=3150E8C, name=NI2901) — плата на pi5-2 (проверено 2026-09-03).
# serial не указываем: на pi5-2 одно устройство, srsenb найдёт его сам.
# Проверенные буферы: крупные стабилизируют TX, recv=2048 убирает overflow.
device_args = recv_frame_size=2048,send_frame_size=9232
tx_gain = 90  # Коэффициент передачи (дБ)
rx_gain = 80  # Коэффициент приёма (дБ)

[log]
all_level = info     # Базовый уровень для всех слоёв
all_hex_limit = 64   # Лимит hex-дампа (байт)
rrc_level = info     # RRC
s1ap_level = debug   # S1AP: S1-MME с ядром
mac_level = info     # MAC
phy_level = debug    # PHY
filename = /var/log/srsran/enb.log  # Путь к файлу лога
file_max_size = 20000  # Макс. размер файла (КБ) ~20 МБ

[gui]
enable = false  # Включить GUI

[expert]
rrc_inactivity_timer = 70000  # Таймаут неактивности RRC (мс)
