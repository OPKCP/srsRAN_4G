# docker-compose для Open5GS (4G EPC) — развёртывание на pi5-2.
#
# Состав 4G EPC (Open5GS CUPS): mme, hss, pcrf, sgwc, sgwu, smf(pgwc), upf(pgwu).
# MongoDB — отдельным контейнером.
#
# Ядро работает в network host (как прежний srsepc), чтобы слушать S1-MME (SCTP 36412)
# и GTP-U (UDP 2152) на физическом IP 192.168.1.26 (pi5-2), к которому подключаются
# обе БС (Base5=192.168.1.25, pi5-2=enb2=192.168.1.20).
#
# ВАЖНО: перед запуском сверить mcc/mnc/tac/адреса в ./config/*.yaml
#        с фактической конфигурацией БС (enb.conf на Base5 и pi5-2).

services:
  mongodb:
    image: mongo:6
    container_name: open5gs-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      open5gs_net:
        ipv4_address: 172.30.1.2
    ports:
      - "127.0.0.1:27017:27017"

  # Ядро Open5GS (все NF) в network host. Конфиги монтируются из ./config.
  open5gs:
    image: open5gs-arm64:v2.7.2
    container_name: open5gs
    restart: unless-stopped
    depends_on:
      - mongodb
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ./config:/etc/open5gs:ro
      - ./logs:/var/log/open5gs
      # freeDiameter конфиги, если собирались (для S6a между MME/HSS):
      # - ./config/freeDiameter:/etc/freeDiameter:ro
    # Команда по умолчанию — open5gs-mmed (запуск всех NF — см. run_open5gs.sh)
    command: ["/bin/bash", "-c", "tail -f /dev/null"]

networks:
  open5gs_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.1.0/24

volumes:
  mongo_data:
