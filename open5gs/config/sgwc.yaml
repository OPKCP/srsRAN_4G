logger:
  file:
    path: /var/log/open5gs/sgwc.log
  level: info

global:
  max:
    ue: 1024

sgwc:
  gtpc:
    server:
      - address: 127.0.0.3             # S11 (bound на своём loopback — не конфликтует с MME/SMF на 2123)
    client:
      mme:
        - address: 127.0.0.2
      smf:
        - address: 127.0.0.4           # S5c
  pfcp:
    server:
      - address: 127.0.0.3             # Sxa (bound) на своём loopback
    client:
      sgwu:
        - address: 127.0.0.6           # Sxa to SGW-U
  metrics:
    server:
      - address: 127.0.0.3
        port: 9090
