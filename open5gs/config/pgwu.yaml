# Open5GS — PGW-U / SMF user plane (шаблон)
# Целевой стенд: ядро на pi5-2 (192.168.1.26).
#
# Определяет GTP-U (S5u/N4u) и SGi (выход в сеть/интернет) для абонентов.
# UE IP-пул и шлюз задаются в SMF/PGW-C (см. smf.yaml / pgwc.yaml).
# Здесь абонентская подсеть: 10.0.0.0/24 (шлюз 10.0.0.1).
#
# Источник: https://github.com/open5gs/open5gs/blob/main/configs/open5gs/upf.yaml.in

logger:
    file:
        path: /var/log/open5gs/pgwu.log
    level: info

parameter:
    no_ipv6: true

upf:
    pfcp:
        server:
            - address: 192.168.1.26        # Sxb (PFCP) к SMF/PGW-C
    gtpu:
        server:
            - address: 192.168.1.26        # S5u/N4u GTP-U
    session:
        - subnet: 10.0.0.0/16              # UE IP-пул (уточнить: подсеть 10.0.0.0/24)
          gateway: 10.0.0.1                # SGi шлюз
