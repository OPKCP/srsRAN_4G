[enb]
enb_id = 0x19B  # 20-битный идентификатор eNB
mcc = 250  # Мобильный код страны
mnc = 63  # Мобильный код сети
mme_addr = 192.168.1.16  # IP-адрес MME (EPC-контейнер) во внутренней Docker-сети
gtp_bind_addr = 192.168.1.15  # Локальный IP eNB-контейнера во внутренней Docker-сети
s1c_bind_addr = 192.168.1.15  # Локальный IP eNB-контейнера во внутренней Docker-сети
s1c_bind_port = 0  # Исходный порт для S1AP (0 = любой)
n_prb = 15  # Количество физических ресурсных блоков (6,15,25,50,75,100)

[enb_files]
sib_config = sib.conf  # Файл конфигурации SIB1, SIB2, SIB3
rr_config  = rr.conf  # Файл конфигурации радиоресурсов
rb_config = rb.conf  # Файл конфигурации SRB/DRB

[rf]
# WARNING про стабильность USRP B210 (проверено):
# - НЕ подключать USRP на USB 3.0 (SuperSpeed)! Даёт LIBUSB_TRANSFER_OVERFLOW на RX-потоке
#   -> тысячи "Fatal radio error", TX-индикатор горит, RX-нет. Лечится подключением на USB 2.0 (480M).
# - Питание: недопитание малинки (throttled=0x50000, undervoltage) даёт нестабильность при большой
#   средней мощности TX. Нужен мощный БП малинки 5В/5А ИЛИ отдельный БП USRP (разъём на плате).
# - tx_gain: 80-90. 90 (макс) телефон видит дальше, но выше пиковый ток; 80 - компромисс.
tx_gain = 80  # Коэффициент передачи (дБ) - уменьшено для снижения пикового тока (нестабильность питания USRP)
rx_gain = 80  # Коэффициент приёма (дБ) - повышен для лучшего приёма UL от телефона
# TX: крупные буферы стабилизируют передачу (подтверждено ~10 underflow/30с на 9232).
# RX: recv_frame_size=2048 (не 9232) устраняет LIBUSB_TRANSFER_OVERFLOW (переполнение RX-буфера)
#     -> Fatal radio error + не горел RX-индикатор при 9232.
device_args = send_frame_size=9232,recv_frame_size=2048

[log]
all_level = info     # Базовый уровень для всех слоёв
all_hex_limit = 64   # Лимит hex-дампа (байт)
# Детальные уровни для диагностики attach телефона
# NAS-сообщения в srsenb логируются через rrc_level (отдельной опции log.nas_level нет)
rrc_level = debug    # RRC + встроенный NAS: соединение UE, attach, реконфигурация
s1ap_level = debug   # S1AP: S1-MME с ядром
mac_level = debug    # MAC: планирование, RACH, UL/DL grants, retx (детальная передача данных)
phy_level = debug    # PHY: синхронизация, PDSCH/PUSCH помехи, CRC, SNR
filename = /var/log/srsran/enb.log  # Путь к файлу лога
file_max_size = 20000  # Макс. размер файла (КБ) ~20 МБ, ротация при превышении

[gui]
enable = false  # Включить GUI

[expert]
rrc_inactivity_timer = 70000  # Таймаут неактивности RRC (мс)


