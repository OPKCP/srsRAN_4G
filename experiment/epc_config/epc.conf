[mme]
mme_code = 0x1a
mme_group = 0x0001
tac = 0x0007
mcc = 250
mnc = 63
mme_bind_addr = 192.168.1.16  # IP pi5-2 (EPC). Конкретный IP - чтобы SPGW сообщал eNB реальный адрес S1-MME
apn = IS2026.net
dns_addr = 8.8.8.8
encryption_algo = EEA0
integrity_algo = EIA1
paging_timer = 15
request_imeisv = false
lac = 0x0006
full_net_name = IS2026

[hss]
db_file = user_db.csv

[spgw]
gtpu_bind_addr   = 192.168.1.16  # IP pi5-2. ОБЯЗАТЕЛЬНО конкретный IP (не 0.0.0.0) - иначе SPGW сообщит eNB адрес S1-U=0.0.0.0 и user-plane (данные) не заработает
sgi_if_addr      = 10.0.0.1
sgi_if_name      = srs_spgw_sgi
max_paging_queue = 100

[pcap]
enable   = false
filename = /tmp/epc.pcap

[log]
all_level   = info
all_hex_limit = 64
nas_level     = debug
s1ap_level    = debug
mme_gtpc_level= debug
hss_level     = debug
spgw_gtpc_level = info
spgw_level    = info
gtpu_level    = info
filename    = /var/log/srsran/epc.log
