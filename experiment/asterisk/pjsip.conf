; ==============================================================================
; pjsip.conf — Asterisk PJSIP конфигурация для LTE-пикосоты (srsRAN)
; Абоненты: 1001..100N (масштабируемо, добавляется новая секция на абонента).
; Телефоны в подсети абонентов 10.0.0.0/24 (через LTE-радио - eNB/EPC).
; ==============================================================================

; --- Глобальные настройки (по умолчанию) ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; --- Шаблон endpoint'а (общий для абонентов) ---
[ep-endpoint](!)
type=endpoint
context=lte-local          ; dialplan для внутренних вызовов
disallow=all
allow=ulaw
allow=alaw
allow=g722
allow=opus
direct_media=no            ; медиа (RTP) идёт через сервер (проще для NAT/LTE)
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=no

; --- Шаблон aor (регистрация) ---
[ep-aor](!)
type=aor
max_contacts=1
remove_existing=yes

; --- Шаблон auth ---
[ep-auth](!)
type=auth
auth_type=userpass

; ==============================================================================
; АБОНЕНТЫ (добавляйте новых копированием секции)
; ==============================================================================
; --- Абонент 1001 ---
[1001](ep-endpoint)
auth=1001-auth
aors=1001

[1001-aor](ep-aor)
contact=sip:1001@0.0.0.0:5060

[1001-auth](ep-auth)
username=1001
password=1001secret

; --- Абонент 1002 ---
[1002](ep-endpoint)
auth=1002-auth
aors=1002

[1002-aor](ep-aor)
contact=sip:1002@0.0.0.0:5060

[1002-auth](ep-auth)
username=1002
password=1002secret

; --- Абонент 1003 (пустая SIM 3) ---
[1003](ep-endpoint)
auth=1003-auth
aors=1003

[1003-aor](ep-aor)
contact=sip:1003@0.0.0.0:5060

[1003-auth](ep-auth)
username=1003
password=1003secret

; --- Абонент 1004 (пустая SIM 4) ---
[1004](ep-endpoint)
auth=1004-auth
aors=1004

[1004-aor](ep-aor)
contact=sip:1004@0.0.0.0:5060

[1004-auth](ep-auth)
username=1004
password=1004secret
