; ==============================================================================
; extensions.conf — dialplan Asterisk для LTE-пикосоты (внутренние вызовы)
; Паттерн [_100X] => любой внутренний абонент 1001..1009 звонит по номеру.
; Масштабируемо: достаточно добавить endpoint в pjsip.conf и абонент сразу
; становится доступен по своему 100X номеру (без изменения dialplan).
; ==============================================================================

[lte-local]
; Приветствие/телеметрия
exten => s,1,NoOp(Incoming internal call)
 same => n,Answer()
 same => n,Wait(0.5)

; Вызов внутреннего абонента 1001..1009
exten => _100X,1,NoOp(Вызов внутреннего абонента ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Немасштабируемая справка
exten => 800,1,Playback(hello-world)
 same => n,Hangup()
